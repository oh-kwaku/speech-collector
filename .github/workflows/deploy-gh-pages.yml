name: Deploy frontend to GitHub Pages

# Builds frontend/ with VITE_API_BASE_URL baked in from the repo's Actions
# variable (Settings -> Secrets and variables -> Actions -> Variables tab ->
# VITE_API_BASE_URL) and pushes dist/ to the gh-pages branch, replacing the
# local `npm run deploy` workflow described in README.md.

on:
  push:
    branches: [frontend,master]
    paths: [frontend/**]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
